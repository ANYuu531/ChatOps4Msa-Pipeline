metadata:
  name: api-gateway
  namespace: petclinic
  labels: { app: api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway, version: v1 }
    spec:
      containers:
        - name: api-gateway
          image: petclinic-k8s/spring-petclinic-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits: { memory: "640Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
---
