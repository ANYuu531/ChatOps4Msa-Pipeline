# The business services. Apply AFTER config-server is Ready (they fetch config
# from config-server on startup). This is the k8s-native fork: no Eureka, no
# discovery-server. The api-gateway reaches the business services directly over
# Kubernetes Service DNS (http://customers-service:8081 ...), baked into the
# forked api-gateway image — so these calls go through the meshed ClusterIP and
# Istio observes every edge (unlike Eureka's lb://, which resolved to pod IPs
# and bypassed the Service VIP — the original 403/coverage headache).
#
# IMAGES ARE LOCAL. The four app images below are built from your fork on the
# cluster machine and imported into k3s' containerd (see fork/README.md), so
# imagePullPolicy is Never — k3s must use the imported image and never fall back
# to the upstream Docker Hub build (which still has Eureka). If a pod reports
# ErrImageNeverPull, the import step was missed.
#
# SPRING_PROFILES_ACTIVE=docker still points spring.config.import at config-server
# by its Kubernetes Service name. The Deployment names ARE the node names in the
# dependency graph (api-gateway, customers-service, vets-service, visits-service).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  namespace: petclinic
  labels: { app: customers-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: customers-service }
  template:
    metadata:
      labels: { app: customers-service, version: v1 }
    spec:
      containers:
        - name: customers-service
          image: petclinic-k8s/spring-petclinic-customers-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: petclinic
  labels: { app: customers-service }
spec:
  selector: { app: customers-service }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
