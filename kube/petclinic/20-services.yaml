# The business services. Apply AFTER config-server and discovery-server are Ready
# (they fetch config from config-server and register with Eureka on startup).
#
# SPRING_PROFILES_ACTIVE=docker is what makes each service address config-server
# and discovery-server by those Kubernetes Service names — the same profile the
# upstream docker-compose uses. These are the workloads Istio observes, so the
# Deployment names ARE the node names in the dependency graph
# (api-gateway, customers-service, vets-service, visits-service).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  namespace: petclinic
  labels: { app: customers-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: customers-service }
  template:
    metadata:
      labels: { app: customers-service, version: v1 }
      annotations:
        # Keep the Eureka control-plane port (8761) out of the mesh on the client side
        # too — paired with discovery-server's excludeInboundPorts. See 10-config-discovery.yaml.
        traffic.sidecar.istio.io/excludeOutboundPorts: "8761"
    spec:
      containers:
        - name: customers-service
          image: springcommunity/spring-petclinic-customers-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
            # Register in Eureka by the Kubernetes Service name, NOT the pod IP.
            # With prefer-ip-address=true the services advertised their pod IPs, so
            # api-gateway's `lb://` resolution and the registry-fetch redirect dialed
            # raw pod IPs — bypassing the Service VIP, so Istio dropped them to the
            # passthrough cluster and returned 403 (empty registry -> /api/** 405/500).
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: customers-service
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: petclinic
  labels: { app: customers-service }
spec:
  selector: { app: customers-service }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits-service
  namespace: petclinic
  labels: { app: visits-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: visits-service }
  template:
    metadata:
      labels: { app: visits-service, version: v1 }
      annotations:
        # See customers-service: Eureka port out of the mesh on the client side.
        traffic.sidecar.istio.io/excludeOutboundPorts: "8761"
    spec:
      containers:
        - name: visits-service
          image: springcommunity/spring-petclinic-visits-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
            # See customers-service: register by Service name so mesh routing/mTLS works.
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: visits-service
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
