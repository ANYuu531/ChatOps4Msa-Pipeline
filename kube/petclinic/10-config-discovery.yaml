# Platform services the app services depend on at startup. Apply these FIRST and
# wait for both to be Ready, then apply 20-services.yaml — the app services fetch
# their config from config-server and register with discovery-server (Eureka).
#
# The Service names MUST be exactly `config-server` and `discovery-server`: the
# app services run with SPRING_PROFILES_ACTIVE=docker, whose config addresses them
# by those hostnames (resolved via Kubernetes DNS).
#
# config-server clones its config from GitHub on startup, so the cluster machine
# must have outbound internet. If it cannot reach GitHub it will not become Ready.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: petclinic
  labels: { app: config-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server, version: v1 }
    spec:
      containers:
        - name: config-server
          image: springcommunity/spring-petclinic-config-server:latest
          ports:
            - containerPort: 8888
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: petclinic
  labels: { app: config-server }
spec:
  selector: { app: config-server }
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: petclinic
  labels: { app: discovery-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery-server }
  template:
    metadata:
      labels: { app: discovery-server, version: v1 }
      annotations:
        # Take the Eureka control-plane port out of the mesh. Netflix's Eureka client
        # uses a separate "query" transport for the full-registry fetch (GET /eureka/apps),
        # and Istio's inbound sidecar answers that specific request with 403 — the app
        # never sees it, and there is no AuthorizationPolicy/PeerAuthentication involved
        # (heartbeats and plain curl to the same URL return 200/404). The result: every
        # service registers but none can fetch the registry, so `lb://` never resolves
        # and all business routes 405/500. Excluding 8761 makes discovery behave as it
        # does outside Istio. Must be paired with excludeOutboundPorts:8761 on the clients
        # (20-services.yaml) so both ends speak plaintext. Trade-off: the service->discovery
        # edges no longer show in Istio telemetry (they remain derivable from code/config);
        # the business edges (8081/8082/8083) stay in the mesh.
        traffic.sidecar.istio.io/excludeInboundPorts: "8761"
    spec:
      containers:
        - name: discovery-server
          image: springcommunity/spring-petclinic-discovery-server:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
            # The config repo sets prefer-ip-address=true + hostname=localhost, so the
            # server advertised itself (and its redirect target) by pod IP. Eureka
            # clients then fetched the registry via that pod IP, bypassing the Service
            # VIP -> Istio passthrough -> 403 -> empty registry. Advertise by the
            # Service name so the fetch/redirect stays on the meshed Service path.
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: discovery-server
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: petclinic
  labels: { app: discovery-server }
spec:
  selector: { app: discovery-server }
  ports:
    - name: http
      port: 8761
      targetPort: 8761
