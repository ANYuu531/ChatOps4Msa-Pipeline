# Discord
discord.application.token=
discord.application.id=
discord.guild.id=
discord.channel.chatops.id=

# ChatOps4Msa
capability.microservice-system.classpath=classpath*:capability/microservice-system/*.{yml,yaml}
capability.devops-tool.classpath=classpath*:capability/devops-tool/*.{yml,yaml}
capability.message-delivery.classpath=classpath*:capability/message-delivery.{yml,yaml}
capability.secret.classpath=classpath*:capability/secret.{yml,yaml}
toolkit.classpath.prefix=ntou.soselab.chatops4msa.Entity.ToolkitFunction.
intent.expired_time=60000

# OpenAI
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.key=
openai.api.model=gpt-3.5-turbo
prompts.prompt_injection_detection.file=prompts/prompt_injection_detection.txt
prompts.end_of_topic.file=prompts/end_of_topic.txt
prompts.intent_classification_and_entity_extraction.file=prompts/intent_classification_and_entity_extraction.txt
prompts.querying_missing_parameters.file=prompts/querying_missing_parameters.txt

# RabbitMQ
# e.g. https://link.to.rabbitmq
rabbitmq.host.url=
rabbitmq.queue.name=event-queue
rabbitmq.create_queue.api=${rabbitmq.host.url}/api/queues/%2F/${rabbitmq.queue.name}
# e.g. 192.168.xxx.xxx
spring.rabbitmq.host=
spring.rabbitmq.port=5672
spring.rabbitmq.username=
spring.rabbitmq.password=
# Dependency analysis checkpoint
# Where the per-user analysis checkpoint is stored, so that pausing to supplement
# evidence can be resumed instead of re-running DeepWiki and the code extraction.
# Mount this as a volume to keep checkpoints across restarts.
dependency.state.dir=./dep-state
dependency.state.ttl-hours=24

# Report Q&A ("ask the report" thread opened under every generated report).
# Archives (report + graph + evidence notes) live here and expire after the TTL.
dependency.qa.dir=./dep-reports
dependency.qa.ttl-days=7
# Semantic retrieval on top of BM25; falls back to lexical-only when the call fails.
dependency.qa.embeddings=true
dependency.qa.top-k=8
openai.api.embedding-model=text-embedding-3-small
# Defaults to openai.api.url with /chat/completions replaced by /embeddings.
#openai.api.embedding-url=
