<text x="856.0" y="595.6" font-size="10" font-weight="400" fill="#5b6770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">只有在真的推不出來時才出現這顆按鈕。</text>
<text x="856.0" y="608.6" font-size="12.0" font-weight="400" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Discord Modal 收值 → 存 checkpoint → 自動 resume。</text>
<text x="856.0" y="626.0" font-size="12.0" font-weight="400" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">等值的請求被扣住標 [WAIT]，不會半填就送出。</text>
<text x="856.0" y="643.4" font-size="12.0" font-weight="700" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">〔程式碼〕</text>
