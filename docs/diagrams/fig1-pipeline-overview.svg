<text x="346.0" y="475.6" font-size="10" font-weight="400" fill="#5b6770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Istio 是被動的：一條邊只有在請求真的跨過去時才會被記錄</text>
