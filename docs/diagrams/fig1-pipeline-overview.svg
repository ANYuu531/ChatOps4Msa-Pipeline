<text x="856.0" y="706.9" font-size="12.0" font-weight="400" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Apply ServiceEntries</text>
<text x="856.0" y="724.3" font-size="10" font-weight="400" fill="#5b6770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">kubectl apply（唯一會改叢集的動作，只在點擊後執行）</text>
<text x="856.0" y="737.3" font-size="12.0" font-weight="400" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">之後 egress 邊才可被歸因</text>
<text x="856.0" y="754.7" font-size="12.0" font-weight="700" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">〔程式碼〕</text>
<rect x="676.0" y="796.0" width="360.0" height="80.0" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="856.0" y="825.6" font-size="12.0" font-weight="400" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">resume：覆蓋率導向迴圈</text>
<text x="856.0" y="843.0" font-size="10" font-weight="400" fill="#5b6770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">用確定性覆蓋率算出「還沒被觀測到的邊」當目標，</text>
<text x="856.0" y="856.0" font-size="12.0" font-weight="400" fill="#1f2a37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">只針對那些邊再導一輪；clone / DeepWiki 從 checkpoint 取回不重跑</text>
